version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/talentflow
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 30
      FORCE_HTTPS: "false"
      AUTH_RATE_LIMIT_MAX: 10
      AUTH_RATE_LIMIT_WINDOW_MIN: 15
      API_RATE_LIMIT_MAX: 300
      API_RATE_LIMIT_WINDOW_MIN: 15
      AI_SERVICE_ENABLED: "true"
      AI_SERVICE_URL: http://ai-service:8000
      EMAIL_ENABLED: "false"
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      # Optional integrations — leave unset (default) to keep them disabled.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      HCAPTCHA_SECRET: ${HCAPTCHA_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - server-uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo-data:
  server-uploads:
